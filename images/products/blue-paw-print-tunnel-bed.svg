<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <rect width="400" height="480" fill="#f5f0e1"/>
  <rect x="20" y="20" width="360" height="440" rx="24" fill="#fff" stroke="#e2d6c7" stroke-width="2"/>
  <!-- Tunnel bed shape -->
  <ellipse cx="200" cy="300" rx="140" ry="60" fill="#50bfdd" opacity="0.15"/>
  <!-- Tunnel opening (left side) -->
  <ellipse cx="80" cy="260" rx="50" ry="70" fill="#50bfdd" opacity="0.2"/>
  <ellipse cx="80" cy="260" rx="50" ry="70" stroke="#50bfdd" stroke-width="3" fill="none"/>
  <!-- Inner tunnel dark -->
  <ellipse cx="85" cy="260" rx="35" ry="50" fill="#332f20" opacity="0.15"/>
  <!-- Tunnel body -->
  <path d="M80 190 Q200 160 320 190 L320 330 Q200 360 80 330 Z" fill="#50bfdd" opacity="0.2"/>
  <path d="M80 190 Q200 160 320 190" stroke="#50bfdd" stroke-width="3" fill="none"/>
  <path d="M80 330 Q200 360 320 330" stroke="#50bfdd" stroke-width="3" fill="none"/>
  <line x1="320" y1="190" x2="320" y2="330" stroke="#50bfdd" stroke-width="3"/>
  <!-- Tunnel end (right side - closed) -->
  <ellipse cx="320" cy="260" rx="15" ry="70" fill="#3da8c5" opacity="0.3"/>
  <!-- Paw prints pattern -->
  <!-- Paw 1 -->
  <circle cx="150" cy="230" r="10" fill="#fff" opacity="0.5"/>
  <circle cx="140" cy="218" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="160" cy="218" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="135" cy="228" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="165" cy="228" r="4" fill="#fff" opacity="0.5"/>
  <!-- Paw 2 -->
  <circle cx="220" cy="250" r="10" fill="#fff" opacity="0.5"/>
  <circle cx="210" cy="238" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="230" cy="238" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="205" cy="248" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="235" cy="248" r="4" fill="#fff" opacity="0.5"/>
  <!-- Paw 3 -->
  <circle cx="180" cy="290" r="8" fill="#fff" opacity="0.4"/>
  <circle cx="172" cy="280" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="188" cy="280" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="168" cy="288" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="192" cy="288" r="3" fill="#fff" opacity="0.4"/>
  <!-- Paw 4 -->
  <circle cx="270" cy="270" r="8" fill="#fff" opacity="0.4"/>
  <circle cx="262" cy="260" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="278" cy="260" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="258" cy="268" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="282" cy="268" r="3" fill="#fff" opacity="0.4"/>
  <!-- Cushion inside opening -->
  <ellipse cx="80" cy="290" rx="30" ry="15" fill="#bfe3d0" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="370" rx="130" ry="20" fill="#332f20" opacity="0.08"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <rect width="400" height="480" fill="#f5f0e1"/>
  <rect x="20" y="20" width="360" height="440" rx="24" fill="#fff" stroke="#e2d6c7" stroke-width="2"/>
  <!-- Bed base (oval) -->
  <ellipse cx="200" cy="280" rx="140" ry="80" fill="#2f5d46" opacity="0.2"/>
  <ellipse cx="200" cy="280" rx="140" ry="80" stroke="#2f5d46" stroke-width="3" fill="none"/>
  <!-- Raised rim -->
  <path d="M60 260 Q60 200 120 180 Q200 160 280 180 Q340 200 340 260" stroke="#2f5d46" stroke-width="3" fill="#2f5d46" opacity="0.15"/>
  <!-- Inner cushion -->
  <ellipse cx="200" cy="290" rx="110" ry="55" fill="#bfe3d0" opacity="0.5"/>
  <ellipse cx="200" cy="290" rx="110" ry="55" stroke="#2f5d46" stroke-width="2" opacity="0.4" fill="none"/>
  <!-- Polka dots on bed -->
  <circle cx="130" cy="270" r="12" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="250" r="12" fill="#fff" opacity="0.6"/>
  <circle cx="270" cy="270" r="12" fill="#fff" opacity="0.6"/>
  <circle cx="160" cy="310" r="10" fill="#fff" opacity="0.5"/>
  <circle cx="240" cy="310" r="10" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="330" r="8" fill="#fff" opacity="0.4"/>
  <!-- Polka dots on rim -->
  <circle cx="100" cy="220" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="195" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="250" cy="195" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="220" r="8" fill="#fff" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="370" rx="130" ry="25" fill="#332f20" opacity="0.08"/>
</svg>

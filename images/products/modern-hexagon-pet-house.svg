<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <rect width="400" height="480" fill="#f5f0e1"/>
  <rect x="20" y="20" width="360" height="440" rx="24" fill="#fff" stroke="#e2d6c7" stroke-width="2"/>
  <!-- Hexagon house shape -->
  <path d="M200 100 L300 155 L300 265 L200 320 L100 265 L100 155 Z" fill="#50bfdd" opacity="0.15"/>
  <path d="M200 100 L300 155 L300 265 L200 320 L100 265 L100 155 Z" stroke="#50bfdd" stroke-width="3" fill="none"/>
  <!-- Inner hexagon (entrance) -->
  <path d="M200 180 L250 207 L250 262 L200 290 L150 262 L150 207 Z" fill="#332f20" opacity="0.1"/>
  <path d="M200 180 L250 207 L250 262 L200 290 L150 262 L150 207 Z" stroke="#332f20" stroke-width="2" opacity="0.4" fill="none"/>
  <!-- Cushion inside -->
  <ellipse cx="200" cy="270" rx="40" ry="15" fill="#d64c3b" opacity="0.3"/>
  <!-- Roof detail -->
  <path d="M200 100 L200 80" stroke="#50bfdd" stroke-width="3"/>
  <circle cx="200" cy="75" r="8" fill="#50bfdd"/>
  <!-- Wood grain lines -->
  <path d="M120 170 L120 250" stroke="#332f20" stroke-width="1" opacity="0.15"/>
  <path d="M140 160 L140 260" stroke="#332f20" stroke-width="1" opacity="0.15"/>
  <path d="M260 160 L260 260" stroke="#332f20" stroke-width="1" opacity="0.15"/>
  <path d="M280 170 L280 250" stroke="#332f20" stroke-width="1" opacity="0.15"/>
  <!-- Base shadow -->
  <ellipse cx="200" cy="340" rx="100" ry="20" fill="#332f20" opacity="0.1"/>
</svg>

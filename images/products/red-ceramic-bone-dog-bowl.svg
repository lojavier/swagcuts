<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <rect width="400" height="480" fill="#f5f0e1"/>
  <rect x="20" y="20" width="360" height="440" rx="24" fill="#fff" stroke="#e2d6c7" stroke-width="2"/>
  <!-- Bowl base (3D perspective) -->
  <ellipse cx="200" cy="320" rx="130" ry="40" fill="#d64c3b" opacity="0.3"/>
  <ellipse cx="200" cy="320" rx="130" ry="40" stroke="#d64c3b" stroke-width="3" fill="none"/>
  <!-- Bowl body -->
  <path d="M70 280 Q70 320 200 340 Q330 320 330 280 L310 200 Q310 180 200 170 Q90 180 90 200 Z" fill="#d64c3b" opacity="0.2"/>
  <path d="M70 280 Q70 320 200 340 Q330 320 330 280" stroke="#d64c3b" stroke-width="3" fill="none"/>
  <path d="M90 200 L70 280" stroke="#d64c3b" stroke-width="3"/>
  <path d="M310 200 L330 280" stroke="#d64c3b" stroke-width="3"/>
  <!-- Bowl rim -->
  <ellipse cx="200" cy="200" rx="120" ry="35" fill="#d64c3b" opacity="0.15"/>
  <ellipse cx="200" cy="200" rx="120" ry="35" stroke="#d64c3b" stroke-width="3" fill="none"/>
  <!-- Inner bowl -->
  <ellipse cx="200" cy="210" rx="95" ry="25" fill="#b23a2c" opacity="0.2"/>
  <!-- Bone decoration on bowl -->
  <ellipse cx="165" cy="280" rx="18" ry="12" fill="#fff" opacity="0.6"/>
  <ellipse cx="235" cy="280" rx="18" ry="12" fill="#fff" opacity="0.6"/>
  <rect x="165" y="272" width="70" height="16" fill="#fff" opacity="0.6"/>
  <!-- Gloss highlight -->
  <ellipse cx="160" cy="190" rx="30" ry="8" fill="#fff" opacity="0.3"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="365" rx="120" ry="20" fill="#332f20" opacity="0.08"/>
</svg>
